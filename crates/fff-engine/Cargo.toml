[package]
name = "fff-engine"
version = "0.11.0"
edition = "2024"
description = "fff singleton search engine daemon — owns FilePicker, BigramFilter, FrecencyTracker"
license = "MIT"

[[bin]]
name = "fff-engine"
path = "src/main.rs"

[dependencies]
fff = { package = "fff-search", path = "../fff-core", default-features = false, version = "0.11.0" }
fff-ipc = { path = "../fff-ipc", version = "0.11.0" }
bincode = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
dirs = { workspace = true }
git2 = { workspace = true }
mimalloc = { workspace = true }
parking_lot = { workspace = true }
tokio = { version = "1", features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
